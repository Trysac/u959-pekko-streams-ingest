# Factory-owned file: agents must not edit it. The lint rules scalafix checks (any finding fails).
rules = [
  DisableSyntax
  LeakingImplicitClassVal
  NoValInForComprehension
  RedundantSyntax
  OrganizeImports
]

DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noWhileLoops = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
  noSemicolons = true
  noTabs = true
}

OrganizeImports {
  # The compiler's -Wunused:all already fails on unused imports.
  removeUnused = false
  groupedImports = Merge
  # Scala 3 import syntax (`*` wildcards, `as` renames); the default rewrites them to Scala 2's.
  targetDialect = Scala3
}
