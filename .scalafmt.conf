# Factory-owned file: agents must not edit it. Layout of this repository; scalafmt applies and checks it.
version = "3.11.5"
runner.dialect = scala3
maxColumn = 100
# A dependency line ends with a comma, so the factory's dependency tool appends one line.
rewrite.trailingCommas.style = always
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
}
